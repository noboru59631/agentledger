name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv
      - run: npm test
      - run: node --check app/app.js
      - run: node --check scripts/serve.mjs

  arc-readonly-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Arc mainnet and USDC using read-only RPC calls
        run: node scripts/arc-readonly-preflight.mjs
