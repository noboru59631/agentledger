name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
      - name: Install Arc Foundry v0.8.0-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arc-foundry.tar.gz"
          extract="$RUNNER_TEMP/arc-foundry"
          bin="$RUNNER_TEMP/arc-foundry-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/circlefin/arc-foundry/releases/download/v0.8.0-2/arc-foundry-v0.8.0-2-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$archive"
          echo '088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556  '"$archive" | sha256sum --check --strict
          mkdir -p "$extract" "$bin"
          tar -xzf "$archive" -C "$extract"
          install -m 0755 "$extract/forge" "$bin/arc-forge"
          install -m 0755 "$extract/cast" "$bin/arc-cast"
          install -m 0755 "$extract/anvil" "$bin/arc-anvil"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: forge build
      - run: forge test -vvv --fuzz-runs 256
      - run: FOUNDRY_PROFILE=arc arc-forge build
      - run: FOUNDRY_PROFILE=arc arc-forge test -vvv --fuzz-runs 256
      - name: Run full lifecycle against local Anvil
        shell: bash
        run: |
          anvil --silent > /tmp/agentledger-anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID"' EXIT
          for attempt in {1..30}; do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          LIFECYCLE_SENDER=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 LIFECYCLE_RPC_URL=http://127.0.0.1:8545 npm run lifecycle
          test -s lifecycle-evidence.json
          node -e "const e=require('./lifecycle-evidence.json'); if(e.transactionHashes.length < 5 || !e.retryBlocked) process.exit(1); console.log('lifecycle tx hashes:', e.transactionHashes.length)"
      - run: npm test
      - run: node --check app/app.js
      - run: node --check scripts/serve.mjs
      - run: node --check scripts/run-lifecycle.mjs
      - run: node --check scripts/run-arc-testnet-lifecycle.mjs
      - run: node --check scripts/arc-mainnet-config.mjs
      - run: node --check scripts/run-arc-mainnet-lifecycle.mjs
      - run: node --check scripts/deployment-init-code.mjs
      - run: node --check scripts/runtime-bytecode.mjs
      - run: node --check scripts/print-mainnet-init-code.mjs

  arc-readonly-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Arc Testnet, USDC, and ERC-8004 using read-only RPC calls
        env:
          ARC_NETWORK: testnet
        run: node scripts/arc-readonly-preflight.mjs

