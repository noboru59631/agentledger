[profile.default]
src = "contracts"
test = "test"
out = "out"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
use_literal_content = false
remappings = [
  "@nomicfoundation/=node_modules/@nomicfoundation/",
  "hardhat/=node_modules/hardhat/",
]
invariant.runs = 128
invariant.depth = 64
invariant.fail_on_revert = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.arc]
network = "arc"

